name: smbcrawler-ui

x-app: &app
  # Pulled from Docker Hub by default (built + published by
  # .github/workflows/docker-publish.yml on every push to main). No local
  # build, no need for the sibling ../smbcrawler checkout at runtime.
  # For local development against your own smbcrawler/backend/frontend
  # changes, build instead:
  #   docker compose -f docker-compose.yml -f docker-compose.build.yml build
  image: ${SMBCRAWLER_UI_IMAGE:-benedelux/smbcrawler-ui:latest}
  environment:
    APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY in .env}
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://smbcrawler:smbcrawler@db:5432/smbcrawler_ui}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    DATA_DIR: ${DATA_DIR:-/data}
    SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-2}
    XDG_DATA_HOME: /data/xdg
  volumes:
    - scandata:/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smbcrawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smbcrawler}
      POSTGRES_DB: ${POSTGRES_DB:-smbcrawler_ui}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smbcrawler}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: >
      sh -c "python -m app.dbinit &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - scandata:/data
      - certs:/certs # writes active.crt/active.key on cert upload/reset
    ports:
      - "${API_PORT:-8000}:8000" # plain HTTP; prefer the proxy's HTTPS port below

  worker:
    <<: *app
    command: >
      sh -c "python -m app.dbinit &&
             python -m app.worker.run"
    # SMB scans need outbound tcp/445 to targets. If your targets sit on the
    # docker host's networks, uncomment the next line (Linux only) and remove
    # the `depends_on`/`networks` conflicts as needed.
    # network_mode: host

  # TLS-terminating reverse proxy in front of `api`. Auto-generates a
  # self-signed certificate on first boot; upload your own via the UI's
  # Settings page (or POST /api/tls/certificate) and it's picked up live,
  # no restart needed (see proxy/entrypoint.sh).
  proxy:
    # Also published by docker-publish.yml, same as api/worker; build it
    # locally instead via docker-compose.build.yml.
    image: ${SMBCRAWLER_UI_PROXY_IMAGE:-benedelux/smbcrawler-ui-proxy:latest}
    volumes:
      - certs:/certs
    ports:
      - "${TLS_PORT:-8443}:443"
    depends_on:
      - api

volumes:
  scandata:
  pgdata:
  certs:
