name: Build and publish Docker image

# Builds the same image docker-compose.yml uses for `api`/`worker` and pushes it
# to Docker Hub. The Dockerfile expects a build context that contains BOTH this
# repo and a sibling `smbcrawler` checkout (see docker-compose.yml's
# `build.context: ..`), so this workflow checks both out as subdirectories of
# one workspace to reproduce that layout in CI.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  - your Docker Hub username
#   DOCKERHUB_TOKEN     - a Docker Hub *access token* (not your password),
#                         create one at https://hub.docker.com/settings/security

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      smbcrawler_ref:
        description: "smbcrawler branch/tag/commit to build against"
        default: main
        required: false

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/smbcrawler-ui
  SMBCRAWLER_REF: ${{ github.event.inputs.smbcrawler_ref || 'main' }}

jobs:
  build-and-push:
    if: github.repository_owner == 'BeNeDeLuX'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smbcrawler-ui
        uses: actions/checkout@v4
        with:
          path: smbcrawler-ui

      - name: Checkout smbcrawler (sibling checkout, as the Dockerfile expects)
        uses: actions/checkout@v4
        with:
          repository: SySS-Research/smbcrawler
          ref: ${{ env.SMBCRAWLER_REF }}
          path: smbcrawler
          fetch-depth: 0 # hatch-vcs derives the version from git tags/history

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: . # workspace root: contains both smbcrawler-ui/ and smbcrawler/
          file: smbcrawler-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
