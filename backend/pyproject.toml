[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smbcrawler-ui-backend"
version = "0.1.0"
description = "Web UI + REST API around smbcrawler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "rq>=2.0",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
