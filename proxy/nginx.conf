# Docker's embedded DNS. Resolving the upstream at request time (via the
# $upstream variable below) rather than at config-load time means nginx still
# starts even if the `api` container isn't up/resolvable yet.
resolver 127.0.0.11 valid=30s;

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/active.crt;
    ssl_certificate_key /certs/active.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 200m; # .crwl / content-archive imports

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;

        # GET /api/scans/{id}/events is server-sent events -- don't buffer or
        # let it hit nginx's default read timeout.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
